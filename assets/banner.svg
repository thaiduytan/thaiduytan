<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#2a2110"/>
      <stop offset="0.55" stop-color="#121010"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.45" stop-color="#E6C25A"/>
      <stop offset="0.55" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#F3D98A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D98A"/>
      <stop offset="0.5" stop-color="#6b5320"/>
      <stop offset="1" stop-color="#C9CED6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="308" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.35"/>

  <!-- rotating metal rings, echoing the avatar -->
  <g transform="translate(600 160)" fill="none">
    <circle r="138" stroke="url(#ring)" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="150" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="124" stroke="#C9CED6" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="40 14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="90s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="600" y="190" font-size="112" letter-spacing="18" fill="url(#gold)">ULTIMA</text>
    <text x="600" y="190" font-size="112" letter-spacing="18" fill="url(#shine)">ULTIMA</text>
  </g>

  <rect x="400" y="218" width="400" height="1.5" fill="url(#rule)"/>

  <text x="600" y="252" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" letter-spacing="6" fill="#C9CED6">FULL-STACK DEVELOPER  ·  QA ENGINEER  ·  AYDEN</text>
  
  <g transform="translate(240 90) scale(1.2)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="3s" begin="0s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(960 80) scale(1.6)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="3s" begin="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(1030 230) scale(0.9)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="3s" begin="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(170 240) scale(0.8)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(845 120) scale(0.7)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(355 205) scale(0.6)">
    <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#FFF4C7">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1.1;0.4" dur="2.6s" begin="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
